services:
  postgres:
    image: postgres:16
    environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
    ports:
        - "5432:5432"
    volumes:
        - postgres_data:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
        interval: 5s
        timeout: 5s
        retries: 5

  api:
    build:
        context: .
        dockerfile: API/Dockerfile
    ports:
        - "8080:8080"
    environment:
        ASPNETCORE_ENVIRONMENT: Development
        ConnectionStrings__EventBookingConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
        Jwt__Key: ${JWT_KEY}
        Jwt__Issuer: ${JWT_ISSUER}
        Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
        postgres:
            condition: service_healthy

volumes:
  postgres_data: